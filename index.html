<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="top-nav" aria-label="Search options">
        <a href="images.html">Images</a>
        <a href="advanced.html">Advanced Search</a>
        <a href="forms.html">Form Elements</a>
        <a href="https://d3jv1k.github.io/">Portfolio</a>
    </nav>

    <main class="search-home">
        <a class="wordmark" href="index.html" aria-label="Google home">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </a>
        <form class="search-form" action="https://www.google.com/search" method="get">
            <label class="visually-hidden" for="search-query">Search</label>
            <input class="search-box" id="search-query" type="text" name="q" autocomplete="off">
            <div class="search-buttons">
                <input type="submit" value="Google Search">
                <input type="submit" name="btnI" value="I'm Feeling Lucky">
            </div>
        </form>
    </main>
    <footer class="site-footer">
        <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fd3jv1k.github.io%2Fgooglesearch%2Findex.html">Validate HTML</a>
        <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fd3jv1k.github.io%2Fgooglesearch%2Fstyles.css">Validate CSS</a>
        <a href="https://github.com/D3jv1k/googlesearch/blob/main/citace.md">Sources &amp; citations</a>
    </footer>
</body>
</html>
